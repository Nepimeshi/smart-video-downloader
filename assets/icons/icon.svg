<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <!-- Rounded geometric container on transparent background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="100" height="100" rx="21" fill="#0b1120" fill-opacity="0.82" />
  <!-- Minimalist Play Triangle (upper-left) -->
  <polygon points="36,30 36,78 78,54" fill="#ffffff" />
  <!-- Crisp Download Arrow (lower-right) -->
  <rect x="80" y="54" width="12" height="28" rx="4" fill="url(#accentGrad)" />
  <polygon points="68,76 104,76 86,98" fill="url(#accentGrad)" />
  <!-- Base tray bar -->
  <rect x="36" y="96" width="56" height="8" rx="4" fill="#ffffff" fill-opacity="0.9" />
</svg>
